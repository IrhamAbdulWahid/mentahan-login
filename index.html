<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentahan Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js"></script>
</head>
<body>

    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Nama kamu" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Password kamu" required>

            <input type="submit" value="Login">
        </form>

        <a href="#">Lupa Password?</a>
        <a href="register.html">Belum punya akun? Daftar</a>
    </div>

</body>
</html>
